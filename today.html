<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="./styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="./js/theme.js"></script>
  <script src="./js/pwa.js"></script>
</head>
<body>
  <div class="page today">
    <header class="today-head">
      <div class="head-top">
        <a class="back" href="./menu.html">←</a>
        <h2 id="dateTitle">Today</h2>
        <a class="gear" href="./pages/settings.html">⚙</a>
      </div>
      <div class="head-right">
        <input type="date" id="datePicker" />
        <button id="goToday" class="ghost-btn sm">Today</button>
        <button id="saveBtn" class="btn sm">Save</button>
        <button id="wipeBtn" class="ghost-btn sm">Delete</button>
        <span class="hint" id="saveState">Saved</span>
      </div>
    </header>

    <section class="card log-card">
      <h3>Log</h3>
      <div class="row2">
        <label>Sleep <input type="time" id="lastSleep" /></label>
        <label>Wake <input type="time" id="wake" /></label>
      </div>
      <div class="row2" style="margin-top:8px">
        <label>Weight<input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="kg" /></label>
        <label>Hours<input id="sleepH" type="number" inputmode="decimal" step="0.5" placeholder="auto" /></label>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3 id="monthTitleSide">Month</h3>
        <button id="loadMonthCal" class="ghost-btn sm">Reload</button>
      </div>
      <div id="monthCals" style="margin-top:6px"></div>
      <div id="monthTodos" style="margin-top:10px"></div>
      <div class="row2" style="margin-top:8px">
        <button id="moveToday" class="ghost-btn sm">→ Today</button>
        <button id="selMonth" class="ghost-btn sm">Select</button>
      </div>
    </section>

    <div class="day-grid">
    <section class="card">
      <div class="card-head">
        <h3>BrainDump</h3>
      </div>
      <textarea id="braindump" rows="4" placeholder=""></textarea>
      <h4 class="sub">To Do
        <span class="sub-btns">
          <button id="selToday" class="ghost-btn sm">Select</button>
          <button id="addDiv" class="ghost-btn sm">+ Line</button>
          <button id="moveMonth" class="ghost-btn sm">→ Month</button>
        </span>
      </h4>
      <div id="todos"></div>
      <div id="remsBox" style="margin-top:8px"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Time plan</h3>
      </div>
      <div class="palette" id="palette">
        <button data-c="work" class="sw work on">Work</button>
        <button data-c="promise" class="sw promise">Meet</button>
        <button data-c="personal" class="sw personal">Me</button>
        <button data-c="family" class="sw family">Family</button>
        <button data-c="obok" class="sw obokwalk">Obok</button>
        <button data-c="sleep" class="sw sleep">Record</button>
      </div>
      <div id="timetable" class="timetable"></div>
      <div id="blocks"></div>
      <div class="row2" style="margin-top:8px">
        <button id="delChecked" class="ghost-btn">Delete checked</button>
        <button id="clearDay" class="ghost-btn">Clear day</button>
      </div>
    </section>
    </div>
  </div>

  <script src="./js/store.js"></script>
  <script src="./js/today.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/auth.js"></script>
  <script>Auth.guard().then(s => { if (s && window.pullCalendar) pullCalendar(); });</script>
  <script src="./js/nav.js"></script>
</body>
</html>
