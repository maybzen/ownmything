<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="./js/theme.js"></script>
  <script src="./js/pwa.js"></script>
</head>
<body>
  <div class="page today">
    <header class="today-head">
      <div>
        <a class="back" href="./menu.html">←</a>
        <h2 id="dateTitle" style="display:inline">Today</h2>
      </div>
      <div class="head-right">
        <button id="goToday" class="ghost-btn">Today</button>
        <input type="date" id="datePicker" />
        <a class="gear" href="./pages/settings.html">⚙</a>
      </div>
    </header>

    <section class="card">
      <h3>Log</h3>
      <div class="row2">
        <label>Sleep
          <div class="hm" data-for="lastSleep">
            <select data-p="h"></select><span>:</span><select data-p="m"></select>
          </div>
          <input id="lastSleep" type="hidden" />
        </label>
        <label>Wake
          <div class="hm" data-for="wake">
            <select data-p="h"></select><span>:</span><select data-p="m"></select>
          </div>
          <input id="wake" type="hidden" />
        </label>
      </div>
      <div class="row2" style="margin-top:8px">
        <label>Weight<input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="kg" /></label>
        <label>Hours<input id="sleepH" type="number" inputmode="decimal" step="0.5" placeholder="auto" /></label>
      </div>
    </section>

    <section class="card">
      <h3 id="monthTitleSide">Month</h3>
      <div id="monthTodos"></div>
      <button id="addMonthTodo" class="ghost-btn" style="margin-top:8px">+ Add</button>
      <div id="monthCals" style="margin-top:12px"></div>
    </section>

    <div class="day-grid">
    <section class="card">
      <h3>BrainDump</h3>
      <textarea id="braindump" rows="4" placeholder=""></textarea>
      <h4 class="sub">To Do</h4>
      <div id="todos"></div>
      <button id="addTodo" class="ghost-btn" style="margin-top:8px">+ Add</button>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Time plan</h3>
      </div>
      <div class="palette" id="palette">
        <button data-c="work" class="sw work on">Work</button>
        <button data-c="promise" class="sw promise">Meet</button>
        <button data-c="personal" class="sw personal">Me</button>
        <button data-c="family" class="sw family">Family</button>
        <button data-c="obok" class="sw obokwalk">Obok</button>
        <button data-c="sleep" class="sw sleep">Record</button>
      </div>
      <div id="timetable" class="timetable"></div>
      <div id="blocks"></div>
      <div class="row2" style="margin-top:8px">
        <button id="delChecked" class="ghost-btn">Delete checked</button>
        <button id="clearDay" class="ghost-btn">Clear day</button>
      </div>
    </section>
    </div>

    <section class="card" id="remCard" style="display:none">
      <h3>Reminders</h3>
      <div id="rems"></div>
    </section>

    <nav class="menu sub foot">
      <a href="./pages/habit.html">Habit Tracker <span id="habitRate"></span></a>
      <a href="./pages/ledger.html">Ledger</a>
      <a href="./pages/reading.html">Library</a>
      <a href="./pages/night.html">Night</a>
    </nav>
  </div>

  <script src="./js/store.js"></script>
  <script src="./js/today.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/auth.js"></script>
  <script>Auth.guard().then(s => { if (s && window.pullCalendar) pullCalendar(); });</script>
</body>
</html>
