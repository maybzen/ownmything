<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="./js/theme.js"></script>
  <script src="./js/pwa.js"></script>
</head>
<body>
  <div class="page today">
    <header class="today-head">
      <div>
        <a class="back" href="./menu.html">←</a>
        <h2 id="dateTitle" style="display:inline">Today</h2>
      </div>
      <div class="head-right">
        <input type="date" id="datePicker" />
        <a class="gear" href="./pages/settings.html">⚙</a>
      </div>
    </header>

    <section class="card">
      <h3>Log</h3>
      <div class="row2">
        <label>Sleep <input id="lastSleep" readonly placeholder="--:--" /></label>
        <label>Wake <input id="wake" readonly placeholder="--:--" /></label>
      </div>
      <div class="row2" style="margin-top:8px">
        <label>Weight<input id="weight" type="number" step="0.1" placeholder="kg" /></label>
        <label>Hours<input id="sleepH" type="number" step="0.5" placeholder="auto" /></label>
      </div>
    </section>

    <div class="day-grid">
    <section class="card">
      <h3>BrainDump</h3>
      <textarea id="braindump" rows="4" placeholder=""></textarea>
      <h4 class="sub">To Do</h4>
      <div id="todos"></div>
      <button id="addTodo" class="ghost-btn" style="margin-top:8px">+ Add</button>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Time plan</h3>
      </div>
      <div class="palette" id="palette">
        <button data-c="work" class="sw work on">Work</button>
        <button data-c="promise" class="sw promise">Meet</button>
        <button data-c="personal" class="sw personal">Me</button>
        <button data-c="family" class="sw family">Family</button>
        <button data-c="obok" class="sw obokwalk">Obok</button>
        <button data-c="sleep" class="sw sleep">Sleep</button>
        <button data-c="" class="sw erase">Erase</button>
      </div>
      <div id="timetable" class="timetable"></div>
      <div id="blocks"></div>
    </section>
    </div>

    <section class="card">
      <h3 id="monthTitleSide">Month</h3>
      <div id="monthTodos"></div>
      <button id="addMonthTodo" class="ghost-btn" style="margin-top:8px">+ Add</button>
    </section>

    <section class="card">
      <h3>Night</h3>
      <label>One line<input id="oneline" placeholder="" /></label>
      <label class="photo" style="margin-top:8px">Photo <input type="file" id="photo" accept="image/*" /></label>
      <img id="photoPrev" class="photo-prev" alt="" />
    </section>

    <nav class="menu sub foot">
      <a href="./pages/habit.html">Habit Tracker <span id="habitRate"></span></a>
      <a href="./pages/ledger.html">Ledger</a>
      <a href="./pages/reading.html">Library</a>
    </nav>
  </div>

  <div id="drumModal" class="drum-modal" style="display:none">
    <div class="drum-box">
      <div class="drum-cols">
        <div class="drum-col" id="drumH"></div>
        <div class="drum-col" id="drumM"></div>
      </div>
      <div class="drum-btns">
        <button id="drumCancel" class="ghost-btn">Cancel</button>
        <button id="drumOk">OK</button>
      </div>
    </div>
  </div>

  <script src="./js/store.js"></script>
  <script src="./js/today.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/auth.js"></script>
  <script>Auth.guard();</script>
</body>
</html>
