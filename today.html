<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 하루 - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="./js/theme.js"></script>
  <script src="./js/pwa.js"></script>
</head>
<body>
  <div class="page today">
    <a class="back" href="./index.html">← ownmything</a>
    <div class="theme-switch" style="justify-content:flex-end;margin-top:8px">
      <button data-set-theme="mono">무채색</button>
      <button data-set-theme="warm">웜</button>
    </div>
    <header class="today-head">
      <div>
        <h2 id="dateTitle">오늘</h2>
        <p class="hint">데일리플랜 + 10분 타임플랜 + 몸기록</p>
      </div>
      <input type="date" id="datePicker" />
    </header>

    <section class="card">
      <h3>Daily plan — 기상 후 브레인덤프</h3>
      <div class="row3">
        <label>어제 취침 <input type="time" id="lastSleep" /></label>
        <label>오늘 기상 <input type="time" id="wake" /></label>
        <label>취침예정 <input type="time" id="sleepPlan" /></label>
      </div>
      <textarea id="braindump" rows="5" placeholder="오만 거 다 적기 — 머리 속에 있는 거 전부"></textarea>
      <div class="todolist">
        <label class="todo"><input type="checkbox" id="amDone" /><input id="am" placeholder="오전 — 대충 뭐하는지" /></label>
        <label class="todo"><input type="checkbox" id="pmDone" /><input id="pm" placeholder="오후 — 대충 뭐하는지" /></label>
        <label class="todo"><input type="checkbox" id="eveDone" /><input id="eve" placeholder="저녁 — 대충 뭐하는지" /></label>
      </div>
    </section>

    <section class="card">
      <h3>Time plan — 10분 단위 색칠 <span class="hint">드래그로 칠하기 / 같은 칸 다시 누르면 지워짐</span></h3>
      <div class="palette" id="palette">
        <button data-c="work" class="sw work on">업무</button>
        <button data-c="promise" class="sw promise">약속</button>
        <button data-c="personal" class="sw personal">개인</button>
        <button data-c="family" class="sw family">가족</button>
        <button data-c="obokwalk" class="sw obokwalk">오복·산책</button>
        <button data-c="sleep" class="sw sleep">수면</button>
        <button data-c="" class="sw erase">지우개</button>
      </div>
      <div id="timetable" class="timetable"></div>
      <div class="row2">
        <button id="fillWork">평일 회사 스케줄 채우기 (9:30–17:30)</button>
        <span class="hint">점심 11:40–13:00은 개인으로 칠해짐</span>
      </div>
      <p class="hint">한 칸 = 10분. 병원=개인, 집=가족, 오복+산책 통합.</p>
    </section>

    <section class="card">
      <h3>몸 + 하루 한줄 + 한장</h3>
      <div class="row3">
        <label>몸무게(kg)<input id="weight" type="number" step="0.1" placeholder="0.0" /></label>
        <label>수면시간(h)<input id="sleepH" type="number" step="0.5" placeholder="0" /></label>
        <label>한줄일기<input id="oneline" placeholder="오늘 한 줄" /></label>
      </div>
      <label class="photo">하루 한장 사진 <input type="file" id="photo" accept="image/*" /></label>
      <img id="photoPrev" class="photo-prev" alt="" />
    </section>

    <section class="card">
      <h3>해빗 — 매일 체크 <span class="hint" id="habitRate"></span> <a class="back" href="./pages/habit.html">주간·월간 보기 →</a></h3>
      <div id="habits" class="habit-board"></div>
      <div class="row2">
        <input id="newHabit" placeholder="새 해빗 추가 (Anytime으로 들어감)" />
        <button id="addHabit">추가</button>
      </div>
    </section>

    <section class="card">
      <h3>오늘 가계부 퀵입력 <span class="hint">상세는 가계부 페이지에서 천천히</span></h3>
      <div class="row3">
        <input id="expWhat" placeholder="뭐 샀는지" />
        <input id="expAmt" type="number" placeholder="금액" />
        <button id="addExp">추가</button>
      </div>
      <ul id="expList"></ul>
    </section>

    <p class="hint">자동 저장됨 (이 브라우저 로컬). 나중에 비번·공유 붙일 자리 비워둠.</p>
  </div>
  <script src="./js/today.js"></script>
</body>
</html>
