<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 하루 - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="./js/theme.js"></script>
  <script src="./js/pwa.js"></script>
</head>
<body>
  <div class="page today">
    <header class="today-head">
      <div>
        <h2 id="dateTitle">오늘</h2>
      </div>
      <div class="head-right">
        <input type="date" id="datePicker" />
        <a class="gear" href="./pages/settings.html">⚙</a>
      </div>
    </header>

    <div class="day-grid">
    <section class="card">
      <h3>BrainDump</h3>
      <div class="row2">
        <label>잠든 시간 <input type="time" id="lastSleep" /></label>
        <label>기상 시간 <input type="time" id="wake" /></label>
      </div>
      <div class="row2" style="margin-top:8px">
        <label>몸무게(kg)<input id="weight" type="number" step="0.1" placeholder="0.0" /></label>
        <label>수면시간(h)<input id="sleepH" type="number" step="0.5" placeholder="자동 계산" /></label>
      </div>
      <h4 class="sub" id="monthTitle">할일</h4>
      <div id="monthTodos"></div>
      <div class="row2">
        <input id="newMonthTodo" placeholder="이번 달 할일 추가" />
        <button id="addMonthTodo">추가</button>
      </div>
      <h4 class="sub">To Do</h4>
      <div id="todos"></div>
      <div class="row2">
        <input id="newTodo" placeholder="오늘 할일 추가" />
        <button id="addTodo">추가</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>Time plan</h3>
        <button id="fillWork" class="ghost-btn" title="평일 9:30–17:30, 점심 11:40–13:00">🗓 회사 시간</button>
      </div>
      <div class="palette" id="palette">
        <button data-c="work" class="sw work on">업무</button>
        <button data-c="promise" class="sw promise">약속</button>
        <button data-c="personal" class="sw personal">개인</button>
        <button data-c="family" class="sw family">가족</button>
        <button data-c="obokwalk" class="sw obokwalk">오복·산책</button>
        <button data-c="sleep" class="sw sleep">수면</button>
        <button data-c="" class="sw erase">지우개</button>
      </div>
      <div id="timetable" class="timetable"></div>
    </section>
    </div>

    <section class="card">
      <h3>Night</h3>
      <label>한줄일기<input id="oneline" placeholder="오늘 한 줄" /></label>
      <label class="photo" style="margin-top:8px">하루 한장 <input type="file" id="photo" accept="image/*" /></label>
      <img id="photoPrev" class="photo-prev" alt="" />
    </section>

    <nav class="menu sub foot">
      <a href="./pages/habit.html">Habit Tracker <span id="habitRate"></span></a>
      <a href="./pages/ledger.html">가계부</a>
      <a href="./pages/reading.html">서재</a>
    </nav>
  </div>
  <script src="./js/store.js"></script>
  <script src="./js/today.js"></script>
</body>
</html>
