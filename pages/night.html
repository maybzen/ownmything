<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>야간 · ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <header class="today-head">
      <div class="head-top">
        <a class="back" href="../menu.html">←</a>
        <h2>야간 <span class="hint" id="headDate"></span> <span class="hint" id="streak"></span></h2>
        <span class="hint" id="saveState">저장됨</span>
      </div>
      <div class="head-right">
        <button id="goYest" class="ghost-btn sm">어제</button>
        <button id="goTodayDate" class="ghost-btn sm">오늘</button>
        <button id="saveBtn" class="btn sm">저장</button>
        <button id="revertBtn" class="ghost-btn sm" style="display:none">되돌리기</button>
      </div>
    </header>
    <section class="card">
      <div class="flist">
        <label><span>한 줄</span><textarea id="oneline" rows="2" placeholder="오늘 하루를 한 줄로"></textarea></label>
        <label class="photo"><span>사진</span><input type="file" id="photo" accept="image/*" /></label>
      </div>
      <img id="photoPrev" class="photo-prev" alt="" />
      <div class="btn-row">
        <button id="delPhoto" class="ghost-btn sm">사진 삭제</button>
      </div>
      <a id="goToday" class="hint" href="#" style="display:block;margin-top:6px">오늘에서 보기 →</a>
    </section>
    <section class="card">
      <div class="card-head">
        <h3 id="calLabel">달력</h3>
        <div class="head-right">
          <button id="calPrev" class="ghost-btn">‹</button>
          <button id="calNext" class="ghost-btn">›</button>
        </div>
      </div>
      <div class="cal" id="cal"></div>
    </section>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/night.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
  <script src="../js/nav.js"></script>
</body>
</html>
