<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기록 · ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
  <header class="today-head">
    <div class="head-top">
      <a class="back" href="../menu.html">←</a>
      <h2>기록</h2>
    </div>
    <div class="head-right">
      <input id="search" class="mini" type="search" placeholder="검색" style="min-width:120px" />
    </div>
  </header>
  <section class="card" id="searchCard" style="display:none">
    <div class="card-head"><h3>검색 결과</h3><span class="hint" id="searchCount"></span></div>
    <div id="searchList"></div>
  </section>

    <div class="card-head" style="margin-top:14px">
      <h3 id="calLabel"></h3>
      <div class="head-right">
        <button id="mLast" class="ghost-btn sm">지난달</button>
        <button id="mPrev" class="ghost-btn sm">‹</button>
        <input type="month" id="mPicker" class="mini" />
        <button id="mNext" class="ghost-btn sm">›</button>
      </div>
    </div>

    <section class="card">
      <div id="sumCards" class="sm-grid"></div>
    </section>

    <section class="card">
      <div id="calGrid" class="mcal"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3 id="dayTitle"></h3>
        <span class="hint" id="dayDow"></span>
      </div>
      <p class="quote" id="dayOne">—</p>
      <div class="kv">
        <div><span>체중</span><b id="dayW">—</b></div>
        <div><span>수면</span><b id="dayS">—</b></div>
        <div><span>시간</span><b id="dayB">—</b><i id="dayBlock"></i></div>
        <div><span>습관</span><b id="dayH">—</b><i id="dayHSub"></i></div>
      </div>
      <img id="dayPhoto" class="photo-prev" alt="" style="display:none" />
    </section>

    <section class="card">
      <div class="card-head">
        <h3>체중</h3>
        <span class="hint" id="wDelta"></span>
      </div>
      <svg id="wChart" viewBox="0 0 320 140" class="chart"></svg>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>사진</h3>
        <span class="hint" id="photoCount"></span>
      </div>
      <div id="photoWall" class="pw-grid"></div>
    </section>

    <div class="pad-b"></div>
  </div>
  <div id="photoModal" class="sheet-scrim" style="display:none;align-items:center;justify-content:center;padding:20px">
    <div style="background:var(--card);border-radius:12px;max-width:520px;width:100%;padding:12px">
      <img id="modalImg" class="photo-prev" alt="" style="width:100%;margin-top:0" />
      <p class="quote" id="modalCap" style="font-size:0.9rem"></p>
      <p class="hint" id="modalDate"></p>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button id="modalClose" class="ghost-btn sm">닫기</button>
      </div>
    </div>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/archive.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script>Auth.guard().then(() => { if (window.refreshArchive) refreshArchive(); });</script>
</body>
</html>
