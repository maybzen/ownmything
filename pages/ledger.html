<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <a class="back" href="../menu.html">← Menu</a>
    <header class="today-head">
      <h2>Ledger <span class="hint" id="headDate"></span></h2>
      <div class="head-right">
        <button id="goTodayDate" class="ghost-btn">Today</button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <h3>Summary</h3>
        <input type="month" id="mPicker" class="mini" />
      </div>
      <p id="summary" class="hint"></p>
    </section>

    <section class="card">
      <h3>Add</h3>
      <div class="flist">
        <label><span>Date</span><input type="date" id="tDate" /></label>
        <label><span>Type</span><select id="tKind"><option value="expense">Out</option><option value="income">In</option></select></label>
        <label><span>Category</span><select id="tCat"></select></label>
        <label><span>Amount</span><input id="tAmt" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>Method</span><select id="tMethod"><option>Cash</option><option>Account</option><option>Card</option><option>Installment</option></select></label>
        <label><span>Memo</span><input id="tMemo" placeholder="" /></label>
      </div>
      <div class="flist" id="instRow" style="display:none;margin-top:6px">
        <label><span>Card</span><input id="tCard" placeholder="" /></label>
        <label><span>Months</span><input id="tMonths" type="number" min="2" max="36" value="6" /></label>
        <div class="frow"><span class="hint">split into monthly entries</span></div>
      </div>
      <div class="frow" style="display:flex;justify-content:flex-end;margin-top:10px">
        <button id="addTxn" class="btn sm">Add</button>
      </div>
    </section>

    <section class="card">
      <h3>List</h3>
      <ul id="txnList"></ul>
    </section>

    <section class="card">
      <h3>Installments</h3>
      <div id="cardList"></div>
    </section>

    <section class="card">
      <h3>Statements</h3>
      <div class="flist">
        <label><span>Month</span><input type="month" id="sMonth" /></label>
        <label><span>Card</span><input id="sCard" placeholder="" /></label>
        <label><span>Amount</span><input id="sAmt" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>Note</span><input id="sNote" placeholder="" /></label>
        <div class="frow" style="justify-content:flex-end">
          <button id="addStmt" class="btn sm">Add</button>
        </div>
      </div>
      <div id="stmtList" style="margin-top:8px"></div>
    </section>

    <section class="card">
      <h3>Loans</h3>
      <div class="flist">
        <label><span>Name</span><input id="loanName" placeholder="" /></label>
        <label><span>Bank</span><input id="loanBank" placeholder="" /></label>
        <label><span>Principal</span><input id="loanTotal" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>Rate %</span><input id="loanRate" type="number" step="0.1" inputmode="decimal" placeholder="0" /></label>
        <label><span>Monthly</span><input id="loanMonthly" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>Start</span><input id="loanStart" type="month" /></label>
        <label><span>Memo</span><input id="loanMemo" placeholder="" /></label>
        <div class="frow" style="justify-content:flex-end">
          <button id="addLoan" class="btn sm">Add</button>
        </div>
      </div>
      <div id="loanList" style="margin-top:8px"></div>
    </section>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/ledger.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
  <script src="../js/nav.js"></script>
</body>
</html>
