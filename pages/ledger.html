<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <a class="back" href="../menu.html">← Menu</a>
    <header class="today-head">
      <h2>Ledger <span class="hint" id="headDate"></span></h2>
      <div class="head-right">
        <button id="goTodayDate" class="ghost-btn">Today</button>
      </div>
    </header>

    <section class="card">
      <h3>Summary <input type="month" id="mPicker" /></h3>
      <p id="summary" class="hint"></p>
    </section>

    <section class="card">
      <h3>Add</h3>
      <div class="lgrid">
        <input type="date" id="tDate" />
        <select id="tKind"><option value="expense">Out</option><option value="income">In</option></select>
        <select id="tCat"></select>
        <input id="tAmt" type="number" inputmode="decimal" placeholder="Amount" />
        <select id="tMethod"><option>Cash</option><option>Account</option><option>Card</option><option>Installment</option></select>
        <input id="tMemo" placeholder="Memo" />
      </div>
      <div class="lgrid" id="instRow" style="display:none">
        <input id="tCard" placeholder="Card (e.g. Shinhan)" />
        <input id="tMonths" type="number" min="2" max="36" value="6" />
        <span class="hint">months → split monthly</span>
      </div>
      <button id="addTxn" class="btn">Add</button>
    </section>

    <section class="card">
      <h3>List</h3>
      <ul id="txnList"></ul>
    </section>

    <section class="card">
      <h3>Installments</h3>
      <div id="cardList"></div>
    </section>

    <section class="card">
      <h3>Statements</h3>
      <div class="lgrid">
        <input type="month" id="sMonth" />
        <input id="sCard" placeholder="Card" />
        <input id="sAmt" type="number" inputmode="decimal" placeholder="Amount" />
        <input id="sNote" placeholder="Note" />
      </div>
      <button id="addStmt" class="btn">Add</button>
      <div id="stmtList" style="margin-top:8px"></div>
    </section>

    <section class="card">
      <h3>Loans</h3>
      <div class="lgrid">
        <input id="loanName" placeholder="Name (e.g. deposit loan)" />
        <input id="loanBank" placeholder="Bank" />
        <input id="loanTotal" type="number" inputmode="decimal" placeholder="Principal" />
        <input id="loanRate" type="number" step="0.1" inputmode="decimal" placeholder="Rate %" />
        <input id="loanMonthly" type="number" inputmode="decimal" placeholder="Monthly" />
        <input id="loanStart" type="month" />
        <input id="loanMemo" placeholder="Memo" />
        <button id="addLoan" class="btn">Add</button>
      </div>
      <div id="loanList" style="margin-top:8px"></div>
    </section>
    <nav class="menu sub foot">
      <a href="../today.html">Today</a>
      <a href="./archive.html">Archive</a>
      <a href="./night.html">Night</a>
      <a href="./habit.html">Habit Tracker</a>
      <a href="./reading.html">Library</a>
    </nav>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/ledger.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
  <script src="../js/nav.js"></script>
</body>
</html>
