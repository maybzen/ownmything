<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부 · ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <header class="today-head">
      <div class="head-top">
        <a class="back" href="../menu.html">←</a>
        <h2>가계부 <span class="hint" id="headDate"></span></h2>
      </div>
      <div class="head-right">
        <button id="goPrevMonth" class="ghost-btn sm">지난달</button>
        <button id="goTodayDate" class="ghost-btn sm">이번 달</button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <h3>합계</h3>
        <input type="month" id="mPicker" class="mini" />
      </div>
      <p id="summary" class="hint"></p>
    </section>

    <section class="card">
      <h3>추가</h3>
      <div class="flist">
        <label><span>날짜</span><input type="date" id="tDate" /></label>
        <label><span>구분</span><select id="tKind"><option value="expense">지출</option><option value="income">수입</option></select></label>
        <label><span>분류</span><select id="tCat"></select></label>
        <label><span>금액</span><input id="tAmt" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>수단</span><select id="tMethod"><option value="Cash">현금</option><option value="Account">계좌</option><option value="Card">카드</option><option value="Installment">할부</option></select></label>
        <label><span>메모</span><input id="tMemo" placeholder="" /></label>
      </div>
      <div class="flist" id="instRow" style="display:none;margin-top:6px">
        <label><span>카드</span><input id="tCard" placeholder="" /></label>
        <label><span>개월</span><input id="tMonths" type="number" min="2" max="36" value="6" /></label>
        <div class="frow"><span class="hint">월 단위로 나눠 기록</span></div>
      </div>
      <div class="frow" style="display:flex;justify-content:flex-end;margin-top:10px">
        <button id="addTxn" class="btn sm">추가</button>
      </div>
    </section>

    <section class="card">
      <h3>목록</h3>
      <ul id="txnList"></ul>
    </section>

    <section class="card">
      <h3>할부</h3>
      <div id="cardList"></div>
    </section>

    <section class="card">
      <h3>명세서</h3>
      <div class="flist">
        <label><span>달</span><input type="month" id="sMonth" /></label>
        <label><span>카드</span><input id="sCard" placeholder="" /></label>
        <label><span>금액</span><input id="sAmt" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>메모</span><input id="sNote" placeholder="" /></label>
        <div class="frow" style="justify-content:flex-end">
          <button id="addStmt" class="btn sm">추가</button>
        </div>
      </div>
      <div id="stmtList" style="margin-top:8px"></div>
    </section>

    <section class="card">
      <h3>대출</h3>
      <div class="flist">
        <label><span>이름</span><input id="loanName" placeholder="" /></label>
        <label><span>은행</span><input id="loanBank" placeholder="" /></label>
        <label><span>원금</span><input id="loanTotal" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>이자%</span><input id="loanRate" type="number" step="0.1" inputmode="decimal" placeholder="0" /></label>
        <label><span>월납</span><input id="loanMonthly" type="number" inputmode="decimal" placeholder="0" /></label>
        <label><span>시작</span><input id="loanStart" type="month" /></label>
        <label><span>메모</span><input id="loanMemo" placeholder="" /></label>
        <div class="frow" style="justify-content:flex-end">
          <button id="addLoan" class="btn sm">추가</button>
        </div>
      </div>
      <div id="loanList" style="margin-top:8px"></div>
    </section>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/ledger.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
  <script src="../js/nav.js"></script>
</body>
</html>
