<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <a class="back" href="../menu.html">← Menu</a> · <a class="back" href="../today.html">Today</a>
    <h2>Settings</h2>

    <section class="card">
      <h3>Theme</h3>
      <div class="theme-switch" style="justify-content:flex-start">
        <button data-set-theme="mono">Mono</button>
        <button data-set-theme="warm">Warm</button>
      </div>
    </section>

    <section class="card">
      <h3>Account</h3>
      <p id="accountEmail" class="hint"></p>
      <div class="row2" style="margin-top:8px">
        <button id="logoutBtn" class="ghost-btn">Logout</button>
      </div>
    </section>

    <section class="card" id="adminCard" style="display:none">
      <h3>Members</h3>
      <div id="memberList"></div>
      <div class="row2" style="margin-top:8px">
        <input id="inviteEmail" type="email" placeholder="Email to invite" />
        <button id="inviteBtn">Invite</button>
      </div>
      <p id="adminMsg" class="hint" style="margin-top:8px"></p>
    </section>

    <section class="card">
      <h3>Data</h3>
      <button id="exportBtn" class="ghost-btn">Export (JSON)</button>
    </section>
  </div>
  <script src="../js/store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
