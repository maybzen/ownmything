<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <a class="back" href="../menu.html">← Menu</a>
    <header class="today-head">
      <h2>Library <span class="hint" id="headDate"></span></h2>
      <div class="head-right">
        <button id="goTodayDate" class="ghost-btn">All</button>
        <input type="date" id="dateFilter" />
      </div>
    </header>
    <section class="card">
      <h3>Add</h3>
      <div class="lgrid">
        <input id="bTitle" placeholder="Title" />
        <input id="bAuthor" placeholder="Author" />
        <select id="bStatus"><option>Reading</option><option>Done</option><option>Want</option></select>
        <select id="bRating"><option value="0">★ -</option><option value="1">★ 1</option><option value="2">★ 2</option><option value="3">★ 3</option><option value="4">★ 4</option><option value="5">★ 5</option></select>
        <input id="bMemo" placeholder="Memo" />
        <button id="addBook" class="btn">Add</button>
      </div>
    </section>
    <div id="bookGrid" class="book-grid"></div>
    <nav class="menu sub foot">
      <a href="../today.html">Today</a>
      <a href="./night.html">Night</a>
      <a href="./habit.html">Habit Tracker</a>
      <a href="./ledger.html">Ledger</a>
    </nav>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/reading.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
</body>
</html>
