<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서재 · ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <header class="today-head">
      <div class="head-top">
        <a class="back" href="../menu.html">←</a>
        <h2>서재 <span class="hint" id="headDate"></span></h2>
      </div>
      <div class="head-right">
        <button id="goYest" class="ghost-btn sm">어제</button>
        <button id="goTodayDate" class="ghost-btn sm">전체</button>
        <input type="date" id="dateFilter" class="mini" />
      </div>
    </header>
    <section class="card">
      <h3>추가</h3>
      <div class="flist">
        <label><span>제목</span><input id="bTitle" placeholder="" /></label>
        <label><span>저자</span><input id="bAuthor" placeholder="" /></label>
        <label><span>상태</span><select id="bStatus"><option value="Reading">읽는 중</option><option value="Done">완독</option><option value="Want">읽을 것</option></select></label>
        <label><span>평점</span><select id="bRating"><option value="0">★ -</option><option value="1">★ 1</option><option value="2">★ 2</option><option value="3">★ 3</option><option value="4">★ 4</option><option value="5">★ 5</option></select></label>
        <label><span>메모</span><input id="bMemo" placeholder="" /></label>
        <div class="frow" style="justify-content:flex-end">
          <button id="addBook" class="btn sm">추가</button>
        </div>
      </div>
    </section>
    <div id="bookGrid" class="book-grid"></div>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/reading.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
  <script src="../js/nav.js"></script>
</body>
</html>
