<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>체중·수면 · ownmything</title>
  <meta name="theme-color" content="#121316" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <header class="today-head">
      <div class="head-top">
        <a class="back" href="../menu.html">←</a>
        <h2>체중·수면</h2>
        <span class="hint" id="recState">저장됨</span>
      </div>
      <div class="head-right">
        <button id="recSave" class="btn sm">저장</button>
      </div>
    </header>

    <section class="card log-card">
      <div class="card-head">
        <h3>오늘 기록</h3>
        <input type="date" id="recDate" class="mini" />
      </div>
      <div class="row2 log-row">
        <label><span>취침</span><input type="time" id="recSleep" /></label>
        <label><span>기상</span><input type="time" id="recWake" /></label>
        <label><span>체중</span><input id="recWeight" type="number" inputmode="decimal" step="0.1" placeholder="kg" /></label>
        <label><span>시간</span><input id="recSleepH" type="number" inputmode="decimal" step="0.5" placeholder="자동" /></label>
      </div>
    </section>

    <section class="card">
      <h3>체중</h3>
      <p class="hint" id="wSummary"></p>
      <svg id="chart" viewBox="0 0 320 140" class="chart"></svg>
    </section>

    <section class="card">
      <h3>수면</h3>
      <p class="hint" id="sSummary"></p>
      <div id="sleepBars" class="bars"></div>
    </section>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/stats.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/nav.js"></script>
  <script>Auth.guard().then(() => { if (window.refreshStats) refreshStats(); });</script>
</body>
</html>
