<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <a class="back" href="../menu.html">← Menu</a>
    <header class="today-head">
      <h2>Habit Tracker <span class="hint" id="headDate"></span></h2>
      <div class="head-right">
        <button id="goTodayDate" class="ghost-btn">Today</button>
        <input type="date" id="datePicker" class="mini" />
      </div>
    </header>

    <section class="card">
      <h3 id="checkTitle">Today</h3>
      <div id="todayCheck" class="habit-board"></div>
    </section>

    <section class="card">
      <h3>Week <span class="hint" id="weekLabel"></span></h3>
      <div id="weekTable" class="htable"></div>
      <div id="weekRates" class="rates"></div>
    </section>

    <section class="card">
      <h3>Month <span class="hint" id="monthLabel"></span></h3>
      <input type="month" id="monthPicker" />
      <div id="monthCal" class="cal" style="margin-top:8px"></div>
      <div class="legend">
        <span><i style="background:#c9dfc9"></i>100%</span>
        <span><i style="background:#e6eed9"></i>70%+</span>
        <span><i style="background:#f6efdc"></i>30%+</span>
        <span><i style="background:var(--cell)"></i>&lt;30%</span>
      </div>
    </section>

    <details class="card">
      <summary>Manage</summary>
      <div id="defs" style="margin-top:8px"></div>
      <div class="flist" style="margin-top:8px">
        <label><span>Habit</span><input id="newDef" placeholder="New habit" /></label>
        <div class="frow" style="justify-content:flex-end">
          <button id="addDef" class="btn sm">Add</button>
        </div>
      </div>
    </details>

    <details class="card">
      <summary>Report</summary>
      <div id="repBox" style="margin-top:8px"></div>
    </details>

    <details class="card">
      <summary>Data</summary>
      <div style="margin-top:8px">
        <p class="hint" id="dataCount"></p>
        <div class="row2" style="margin-top:8px">
          <button id="clearHabits" class="ghost-btn">Reset check-ins</button>
          <button id="wipeDays" class="ghost-btn danger">Delete all records</button>
        </div>
      </div>
    </details>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/habit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
  <script src="../js/nav.js"></script>
</body>
</html>
