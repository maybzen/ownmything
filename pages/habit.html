<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>습관 · ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <header class="today-head">
      <div class="head-top">
        <a class="back" href="../menu.html">←</a>
        <h2>습관 <span class="hint" id="headDate"></span></h2>
        <span class="hint" id="saveState">자동 저장됨</span>
      </div>
      <div class="head-right">
        <input type="date" id="datePicker" class="mini" />
        <button id="goYest" class="ghost-btn sm">어제</button>
        <button id="goTodayDate" class="ghost-btn sm">오늘</button>
        <button id="revertBtn" class="ghost-btn sm" style="display:none">되돌리기</button>
      </div>
    </header>

    <section class="card">
      <h3 id="checkTitle">오늘</h3>
      <div id="todayCheck" class="habit-board"></div>
    </section>

    <section class="card">
      <h3>주간 <span class="hint" id="weekLabel"></span></h3>
      <div id="weekTable" class="htable"></div>
      <div id="weekRates" class="rates"></div>
    </section>

    <section class="card">
      <h3>월간 <span class="hint" id="monthLabel"></span></h3>
      <input type="month" id="monthPicker" />
      <div id="monthCal" class="cal" style="margin-top:8px"></div>
      <div class="legend">
        <span><i style="background:#c9dfc9"></i>100%</span>
        <span><i style="background:#e6eed9"></i>70%+</span>
        <span><i style="background:#f6efdc"></i>30%+</span>
        <span><i style="background:var(--cell)"></i>&lt;30%</span>
      </div>
    </section>

    <details class="card">
      <summary>관리</summary>
      <div id="defs" style="margin-top:8px"></div>
      <div class="flist" style="margin-top:8px">
        <label><span>이름</span><input id="newDef" placeholder="" /></label>
        <div class="frow" style="justify-content:flex-end">
          <button id="addDef" class="btn sm">추가</button>
        </div>
      </div>
    </details>

    <details class="card">
      <summary>리포트</summary>
      <div id="repBox" style="margin-top:8px"></div>
    </details>

    <details class="card">
      <summary>데이터</summary>
      <div style="margin-top:8px">
        <p class="hint" id="dataCount"></p>
        <div class="row2" style="margin-top:8px">
          <button id="clearHabits" class="ghost-btn sm">체크 초기화</button>
          <button id="wipeDays" class="ghost-btn danger sm">전체 삭제</button>
        </div>
      </div>
    </details>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/habit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard().then(() => { if (window.refreshHabits) refreshHabits(); });</script>
  <script src="../js/nav.js"></script>
</body>
</html>
