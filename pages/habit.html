<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker - ownmything</title>
  <meta name="theme-color" content="#121316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../js/theme.js"></script>
  <script src="../js/pwa.js"></script>
</head>
<body>
  <div class="page">
    <a class="back" href="../menu.html">← Menu</a> · <a class="back" href="../today.html">Today</a>
    <h2>Habit Tracker</h2>

    <section class="card">
      <h3>오늘</h3>
      <div id="todayCheck" class="habit-board"></div>
    </section>

    <section class="card">
      <h3>주간 <span class="hint" id="weekLabel"></span></h3>
      <div id="weekTable" class="htable"></div>
      <div id="weekRates" class="rates"></div>
    </section>

    <section class="card">
      <h3>월간 <span class="hint" id="monthLabel"></span></h3>
      <input type="month" id="monthPicker" />
      <div id="monthRates" class="rates"></div>
    </section>

    <details class="card">
      <summary>관리</summary>
      <div id="defs" style="margin-top:8px"></div>
      <div class="row2">
        <input id="newDef" placeholder="새 해빗" />
        <button id="addDef">추가</button>
      </div>
    </details>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/habit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script>Auth.guard();</script>
</body>
</html>
